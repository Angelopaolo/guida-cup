<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guida al CUP · Avanzamento chiamate</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden}
    body{height:100dvh;display:flex;flex-direction:column;font:14px Arial,sans-serif;background:#f4f7f5;color:#183c52}
    nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 5%;flex:none}
    a,button{color:inherit;font:inherit}
    button{padding:3px 0;border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    a:focus-visible,button:focus-visible{outline:3px solid #c88035;outline-offset:4px}
    #avviso{margin:0;padding:0 5% 10px;flex:none}
    iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:#f4f7f5}
    [hidden]{display:none!important}
    @media(max-width:480px){nav{gap:10px;padding:12px 16px;font-size:12px}}
  </style>
</head>
<body>
  <nav aria-label="Navigazione monitor">
    <a href="index.html">← Guida al CUP</a>
    <button id="schermo" type="button" aria-pressed="false">Apri il monitor a schermo intero ⛶</button>
  </nav>
  <p id="avviso" role="status" hidden></p>
  <iframe src="https://script.google.com/macros/s/AKfycbxjg2xdSj8QDjEpjdpHpcM3U_SybrPnZiJ5Ny5NCaHiOorRBCnPVJiQvZRHI2uI40D8dA/exec?pagina=monitor" title="Avanzamento delle chiamate CUP: sola visualizzazione"></iframe>
  <script>
    const pulsante = document.getElementById('schermo');
    const avviso = document.getElementById('avviso');
    function aggiornaPulsante() {
      const intero = !!document.fullscreenElement;
      pulsante.textContent = intero ? 'Esci dallo schermo intero ⛶' : 'Apri il monitor a schermo intero ⛶';
      pulsante.setAttribute('aria-pressed', String(intero));
    }
    pulsante.addEventListener('click', async () => {
      pulsante.disabled = true;
      avviso.hidden = true;
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else throw new Error('Schermo intero non disponibile');
      } catch (_) {
        avviso.textContent = 'Il browser non consente lo schermo intero da questo pulsante. Su PC puoi usare F11.';
        avviso.hidden = false;
      } finally { pulsante.disabled = false; aggiornaPulsante(); }
    });
    document.addEventListener('fullscreenchange', aggiornaPulsante);
  </script>
</body>
</html>
